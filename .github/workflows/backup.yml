name: Mirror repo to S3

on:
  schedule:
    # Runs everyday at 12:25 AM UTC
    - cron: '25 0 * * 1'
  workflow_dispatch:

jobs:
  s3Backup:
    runs-on: docker-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Get info
        id: get_info
        run: |
          GIT_COMMIT_DATE=$(git log -1 --date=format:'%d' --format=%cd)
          YESTERDAY_DATE=$(date -d "yesterday" '+%d')
          echo "GIT_COMMIT_DATE=$GIT_COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "YESTERDAY_DATE=$YESTERDAY_DATE" >> $GITHUB_OUTPUT
          echo "Latest commit date: $GIT_COMMIT_DATE"
          echo "Yesterday's date: $YESTERDAY_DATE"

      - name: Ensure AWS CLI is installed
        run: |
          if ! command -v aws &> /dev/null
          then
            echo "AWS CLI not found. Installing..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          else
            echo "AWS CLI already installed. Skipping installation."
            aws --version
          fi
          aws --version || { echo "AWS CLI installation failed"; exit 1; }

      - name: Create backup
        if: steps.get_info.outputs.GIT_COMMIT_DATE == steps.get_info.outputs.YESTERDAY_DATE
        run: |
          sudo apt update && sudo apt install -y python3-pip
          sudo pip3 install github-backup
          sudo github-backup -O 0chain -P -t ${{ secrets.SVC_ACCOUNT_SECRET }} --output-directory=/github-backup/0chain --all -O -R 0chain

      - name: Create zip
        if: steps.get_info.outputs.GIT_COMMIT_DATE == steps.get_info.outputs.YESTERDAY_DATE
        run: |
          sudo zip -r 0chain.zip /github-backup/0chain

      - name: Configure AWS credentials
        if: steps.get_info.outputs.GIT_COMMIT_DATE == steps.get_info.outputs.YESTERDAY_DATE
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_SECRET_KEY_ID }}
          aws-region: us-east-2

      - name: Upload to S3
        if: steps.get_info.outputs.GIT_COMMIT_DATE == steps.get_info.outputs.YESTERDAY_DATE
        run: |
          aws s3 cp 0chain.zip s3://${{ secrets.MIRROR_TARGET }}/0chain.zip
